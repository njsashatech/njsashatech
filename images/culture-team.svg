<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Culture Icon: Teamwork -->
  <defs>
    <linearGradient id="teamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Three people -->
  <circle cx="32" cy="25" r="5" fill="url(#teamGradient)"/>
  <rect x="28" y="31" width="8" height="10" fill="url(#teamGradient)"/>
  
  <circle cx="50" cy="20" r="6" fill="url(#teamGradient)"/>
  <rect x="45" y="27" width="10" height="12" fill="url(#teamGradient)"/>
  
  <circle cx="68" cy="25" r="5" fill="url(#teamGradient)"/>
  <rect x="64" y="31" width="8" height="10" fill="url(#teamGradient)"/>
  
  <!-- Connected circle -->
  <circle cx="50" cy="60" r="18" fill="none" stroke="url(#teamGradient)" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Connection lines -->
  <line x1="32" y1="41" x2="45" y2="48" stroke="url(#teamGradient)" stroke-width="1.5"/>
  <line x1="50" y1="39" x2="50" y2="42" stroke="url(#teamGradient)" stroke-width="1.5"/>
  <line x1="68" y1="41" x2="55" y2="48" stroke="url(#teamGradient)" stroke-width="1.5"/>
</svg>
