<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Feature Icon: Support -->
  <defs>
    <linearGradient id="supportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Headset -->
  <circle cx="50" cy="35" r="15" fill="none" stroke="url(#supportGradient)" stroke-width="2.5"/>
  
  <!-- Headset band -->
  <path d="M 35 35 Q 35 20 50 20 Q 65 20 65 35" fill="none" stroke="url(#supportGradient)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left ear cup -->
  <rect x="28" y="45" width="8" height="12" rx="2" fill="none" stroke="url(#supportGradient)" stroke-width="2"/>
  
  <!-- Right ear cup -->
  <rect x="64" y="45" width="8" height="12" rx="2" fill="none" stroke="url(#supportGradient)" stroke-width="2"/>
  
  <!-- Microphone boom -->
  <path d="M 32 57 Q 32 70 25 75" fill="none" stroke="url(#supportGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="25" cy="75" r="3" fill="url(#supportGradient)"/>
</svg>
