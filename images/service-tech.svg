<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Service Icon: Technology -->
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Laptop screen -->
  <rect x="15" y="20" width="70" height="45" rx="5" fill="none" stroke="url(#techGradient)" stroke-width="3"/>
  
  <!-- Screen content -->
  <rect x="20" y="25" width="20" height="15" fill="url(#techGradient)"/>
  <rect x="45" y="25" width="35" height="8" fill="url(#techGradient)"/>
  <rect x="45" y="37" width="35" height="3" fill="url(#techGradient)"/>
  
  <!-- Laptop base -->
  <path d="M 25 65 L 35 75 L 65 75 L 75 65" stroke="url(#techGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Stand -->
  <line x1="45" y1="65" x2="45" y2="75" stroke="url(#techGradient)" stroke-width="2"/>
  <line x1="55" y1="65" x2="55" y2="75" stroke="url(#techGradient)" stroke-width="2"/>
</svg>
