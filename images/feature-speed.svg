<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Feature Icon: Speed -->
  <defs>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightning bolt -->
  <path d="M 50 15 L 65 40 L 50 40 L 60 75 L 35 50 L 50 50 Z" fill="url(#speedGradient)"/>
  
  <!-- Motion lines -->
  <line x1="20" y1="50" x2="30" y2="50" stroke="url(#speedGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="40" x2="85" y2="35" stroke="url(#speedGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="60" x2="85" y2="65" stroke="url(#speedGradient)" stroke-width="2" stroke-linecap="round"/>
</svg>
