<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Culture Icon: Innovation -->
  <defs>
    <linearGradient id="innovGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightbulb -->
  <circle cx="50" cy="35" r="12" fill="none" stroke="url(#innovGradient)" stroke-width="2.5"/>
  <rect x="44" y="48" width="12" height="8" rx="1" fill="none" stroke="url(#innovGradient)" stroke-width="2"/>
  <line x1="46" y1="56" x2="54" y2="56" stroke="url(#innovGradient)" stroke-width="1.5"/>
  
  <!-- Light rays -->
  <line x1="50" y1="15" x2="50" y2="8" stroke="url(#innovGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="23" x2="73" y2="18" stroke="url(#innovGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="35" x2="82" y2="35" stroke="url(#innovGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="23" x2="27" y2="18" stroke="url(#innovGradient)" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="35" x2="18" y2="35" stroke="url(#innovGradient)" stroke-width="2" stroke-linecap="round"/>
</svg>
