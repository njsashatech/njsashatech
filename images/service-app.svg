<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Service Icon: Mobile App -->
  <defs>
    <linearGradient id="mobileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone body -->
  <rect x="30" y="15" width="40" height="70" rx="4" fill="none" stroke="url(#mobileGradient)" stroke-width="3"/>
  
  <!-- Screen -->
  <rect x="34" y="22" width="32" height="48" rx="2" fill="url(#mobileGradient)"/>
  
  <!-- App icons on screen -->
  <circle cx="40" cy="30" r="2" fill="white"/>
  <circle cx="50" cy="30" r="2" fill="white"/>
  <circle cx="60" cy="30" r="2" fill="white"/>
  
  <rect x="38" y="37" width="4" height="4" fill="white"/>
  <rect x="48" y="37" width="4" height="4" fill="white"/>
  <rect x="58" y="37" width="4" height="4" fill="white"/>
  
  <rect x="38" y="48" width="24" height="2" fill="white"/>
  <rect x="38" y="53" width="24" height="2" fill="white"/>
  <rect x="38" y="58" width="15" height="2" fill="white"/>
  
  <!-- Home button -->
  <circle cx="50" cy="72" r="2" fill="url(#mobileGradient)"/>
</svg>
